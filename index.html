<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Travel Time?</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css" rel="stylesheet">
  <style> body { margin: 0; } 
  #map { position: relative; width: 100%; height: 100vh; inset: 0; } 
   </style>
</head>
<body>
  <div id="map">
</div>
<script type="module">
    import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';
    const map = new maplibregl.Map({
        container: 'map',                 
        center: [-123.166, 49.259],    // [longitude, latitude]
        zoom: 10,
        style: 'https://tiles.openfreemap.org/styles/positron'
        });

    window.map = map;

    const responseTransit = await fetch(`https://api.geoapify.com/v1/isoline?lat=49.259&lon=-123.166&type=time&mode=transit&range=900&apiKey=383e9d8600914a2a9f44d28f043222c4`);
    const isolineTransitGeoJSON = await responseTransit.json();

    const responseCar = await fetch(`https://api.geoapify.com/v1/isoline?lat=49.259&lon=-123.166&type=time&mode=drive&range=900&apiKey=383e9d8600914a2a9f44d28f043222c4`);
    const isolineCarGeoJSON = await responseCar.json();

    map.on('load', () => {
    console.log(isolineTransitGeoJSON);

    map.addSource('isoline-data-source', {
        type: "geojson",
        data: isolineTransitGeoJSON,
        });

    map.addLayer({
        id: 'isoline-line-transit',
        type: "line",
        source: 'isoline-data-source',
         paint: {
             "line-color": '#6666ff',
            "line-width": 2,
         }
        },
    );
    map.addLayer({
        id: `isoline-fill-transit`,
        type: "fill",
        source: 'isoline-data-source',
        paint: {
            "fill-color": '#6666ff',
            "fill-opacity": 0.3,
            },
        })

    map.addSource('isoline-data-source-car', {
        type: "geojson",
        data: isolineCarGeoJSON,
        });

    map.addLayer({
        id: 'isoline-line-car',
        type: "line",
        source: 'isoline-data-source-car',
         paint: {
             "line-color": '#FFD166',
            "line-width": 2,
         }
        },
    );
    map.addLayer({
        id: `isoline-fill-car`,
        type: "fill",
        source: 'isoline-data-source-car',
        paint: {
            "fill-color": '#FFD166',
            "fill-opacity": 0.3,
            },
        })
    });
    </script>
</body>
</html>
